<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Registration System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Access Registration System</h1>
        <form action="/protectaccess" method="post">
            <fieldset>
                <legend>User Registration</legend>
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" name="name" id="name" placeholder="Enter your full name" required />
                </div>
                <div class="form-group">
                    <label for="pw">Password:</label>
                    <input type="text" name="pw" id="pw" placeholder="Enter a strong password" required />
                </div>
                <div class="form-group">
                    <label for="IDnumber">ID Number:</label>
                    <input type="text" name="IDnumber" id="IDnumber" placeholder="e.g., 123456-789-012 or 123456789012" required />
                </div>
                <input type="submit" value="Submit Registration" />
            </fieldset>
        </form>
    </div>
</body>
</html>
